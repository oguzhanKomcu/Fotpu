<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CombiAI - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
        body {
            background-image: linear-gradient(to bottom, #FFDAB9, #E6E6FA);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7e47eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#161121",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="relative flex h-auto min-h-screen w-full flex-col items-center justify-center font-display group/design-root overflow-x-hidden p-4 md:p-6" style="background-image: linear-gradient(to bottom, #FFDAB9, #E6E6FA);">
<main class="w-full max-w-md mx-auto flex flex-col items-center gap-6 py-8">
<h1 class="text-[#131118] tracking-tight text-3xl font-bold leading-tight text-center pb-3">Create Your Account</h1>
<div class="w-full flex flex-col gap-4">
<div class="flex flex-col">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#131118] text-base font-medium leading-normal pb-2">Username</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#131118] focus:outline-none focus:ring-2 focus:ring-primary/50 border-none bg-white/60 h-14 placeholder:text-[#6f6388] p-4 text-base font-normal leading-normal" placeholder="Enter your username" value=""/>
</label>
</div>
<div class="flex flex-col">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#131118] text-base font-medium leading-normal pb-2">Email</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#131118] focus:outline-none focus:ring-2 focus:ring-primary/50 border-none bg-white/60 h-14 placeholder:text-[#6f6388] p-4 text-base font-normal leading-normal" placeholder="Enter your email address" type="email" value=""/>
</label>
</div>
<div class="flex flex-col">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#131118] text-base font-medium leading-normal pb-2">Password</p>
<div class="flex w-full flex-1 items-stretch rounded-xl bg-white/60">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-xl text-[#131118] focus:outline-none focus:ring-2 focus:ring-primary/50 border-none bg-transparent h-14 placeholder:text-[#6f6388] p-4 pr-2 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<div class="text-[#6f6388] flex items-center justify-center pr-4 rounded-r-xl">
<span class="material-symbols-outlined cursor-pointer">visibility</span>
</div>
</div>
</label>
</div>
<div class="flex flex-col">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#131118] text-base font-medium leading-normal pb-2">Confirm Password</p>
<div class="flex w-full flex-1 items-stretch rounded-xl bg-white/60">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-xl text-[#131118] focus:outline-none focus:ring-2 focus:ring-primary/50 border-none bg-transparent h-14 placeholder:text-[#6f6388] p-4 pr-2 text-base font-normal leading-normal" placeholder="Confirm your password" type="password" value=""/>
<div class="text-[#6f6388] flex items-center justify-center pr-4 rounded-r-xl">
<span class="material-symbols-outlined cursor-pointer">visibility</span>
</div>
</div>
</label>
</div>
</div>
<div class="w-full pt-4 flex flex-col items-center gap-4">
<button class="flex h-14 w-full items-center justify-center gap-2 rounded-xl bg-primary px-6 text-base font-bold text-white shadow-lg transition-transform duration-200 hover:scale-[1.02] focus:outline-none focus:ring-4 focus:ring-primary/30">Sign Up</button>
<p class="text-[#131118] text-sm font-normal">Already have an account? <a class="font-bold text-primary hover:underline" href="#">Log In</a></p>
</div>
</main>
</div>
</body></html>
